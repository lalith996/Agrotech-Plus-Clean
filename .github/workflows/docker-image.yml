name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image (Service)
      run: docker build ./ml --file ./ml/Dockerfile.service --tag ml-service:$(date +%s)
    - name: Build the Docker image (Worker)
      run: docker build ./ml --file ./ml/Dockerfile.worker --tag ml-worker:$(date +%s)
