name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image service
      run: docker build ./ml --file ./ml/Dockerfile.service --tag my-image-name-service:$(date +%s)
    - name: Build the Docker image worker
      run: docker build ./ml --file ./ml/Dockerfile.worker --tag my-image-name-worker:$(date +%s)
