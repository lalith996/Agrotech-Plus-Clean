name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the service Docker image
      run: docker build ./ml --file ./ml/Dockerfile.service --tag my-service-image:$(date +%s)
    - name: Build the worker Docker image
      run: docker build ./ml --file ./ml/Dockerfile.worker --tag my-worker-image:$(date +%s)
